spring.application.name=expense-service
server.servlet.context-path=/app/v1

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}

# Database
# Statement caching is the win here: measured 47 prepares for ~90k executions.
# useLocalSessionState avoids the driver round-tripping to read server session
# state. Note it does NOT remove the SET autocommit / SET SESSION TRANSACTION
# statements — those come from the transaction manager and readOnly
# transactions, and still run ~5x per request.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:expense_db}?useLocalSessionState=true&cachePrepStmts=true&prepStmtCacheSize=256&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection pool. The HikariCP default is 10, which saturated under load —
# 188 threads queued with acquire waits up to 1.9s. MySQL allows 151
# connections and peak use across all services was 42, so there is headroom.
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# Defaults to true in Spring Boot, which keeps the persistence context — and
# potentially its connection — open for the whole request, lengthening
# connection hold time and starving the pool. Safe to disable here: every lazy
# access to splitDetails happens inside a @Transactional method.
spring.jpa.open-in-view=false

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=expense-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.be9expensphie.common.event

# Redis (caching)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

# --- Actuator / Prometheus metrics ---
# The management server listens on its own port, which docker-compose never
# publishes, so /actuator is reachable only from inside the compose network.
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
# Server-side histogram buckets, so Grafana can compute true p95/p99 rather
# than averaging pre-computed percentiles across instances.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
